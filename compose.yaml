services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: knotcat
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: knotcat
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knotcat"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
